# Google Ads API configuration template.
# Copy this file to "google-ads.yaml" and fill in your real values.
# The real google-ads.yaml is git-ignored — never commit secrets.

# From: Manager account -> Tools & Settings -> API Center
developer_token: INSERT_DEVELOPER_TOKEN_HERE

# From: Google Cloud Console -> Credentials -> OAuth Client ID (Desktop app)
client_id: INSERT_OAUTH_CLIENT_ID_HERE
client_secret: INSERT_OAUTH_CLIENT_SECRET_HERE

# Generated by running: python generate_refresh_token.py
refresh_token: INSERT_REFRESH_TOKEN_HERE

# Your Manager (MCC) account's 10-digit ID, digits only (no dashes).
# Required when you access client accounts through a manager account.
login_customer_id: INSERT_MANAGER_CUSTOMER_ID_HERE

# Print the full request/response for learning. Set to False to quiet it down.
use_proto_plus: True
